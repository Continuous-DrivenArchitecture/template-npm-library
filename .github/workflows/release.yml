name: Release

on:
  push:
    branches: [main]

# CDA npm Library Profile v1, "Release workflow permissions": the default,
# ephemeral GITHUB_TOKEN is used — no App, no minted installation token, no
# additional secret. contents:write covers creating the git tag and the
# GitHub Release (both operate on refs outside the protected refs/heads/main
# namespace, so no ruleset bypass is required or configured). id-token:write
# covers OIDC for npm Trusted Publishing.
permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      # `private: true` in package.json only stops @semantic-release/npm's
      # own publish step (it checks pkg.private itself) — it does NOT stop
      # semantic-release's core from computing a version and creating a git
      # tag, or @semantic-release/github from creating a GitHub Release.
      # Without this guard, a placeholder repository derived from this
      # template (still private:true, still the placeholder package name)
      # would get a real tag and a real GitHub Release the first time this
      # workflow runs, even though npm publish itself was correctly
      # skipped. private:true is the authoritative signal a derived
      # repository has not yet been customized for real publishing (see
      # README.md, "What a new repository must replace") — checking it
      # here, once, before anything else runs, is simpler and more honest
      # than trying to keep two conditions (private + placeholder name) in
      # sync.
      - name: Guard against releasing a placeholder package
        id: guard
        run: |
          if [ "$(node -p "require('./package.json').private === true")" = "true" ]; then
            echo "::notice::package.json is still private:true (placeholder state) — skipping release. Remove private:true once this repository has been customized for real publishing (see README.md)."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.should_release == 'true'
        run: npm ci
      # npm Trusted Publishing (OIDC) requires npm >= 11.5.1. Node's
      # bundled npm may lag that; pin the CLI itself explicitly rather
      # than assume the runner's Node build is new enough.
      - name: Ensure npm supports OIDC trusted publishing
        if: steps.guard.outputs.should_release == 'true'
        run: npm install -g npm@latest
      - if: steps.guard.outputs.should_release == 'true'
        run: npm run typecheck
      - if: steps.guard.outputs.should_release == 'true'
        run: npm run lint
      - if: steps.guard.outputs.should_release == 'true'
        run: npm run build
      - if: steps.guard.outputs.should_release == 'true'
        run: npm test
      - name: Validate publishable payload
        if: steps.guard.outputs.should_release == 'true'
        run: npm run verify-pack
      # No @semantic-release/git, no chore(release) commit, no push to
      # refs/heads/main. semantic-release computes the next version, writes
      # it into this job's local, disposable checkout only for the
      # duration of `npm publish`, creates the git tag (refs/tags/vX.Y.Z)
      # and the GitHub Release, and publishes to npm via OIDC. See CDA npm
      # Library Profile v1, "Release" and "Version source of truth".
      - if: steps.guard.outputs.should_release == 'true'
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
